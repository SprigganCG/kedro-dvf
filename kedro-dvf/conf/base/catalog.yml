# partitioned dataset
int-preprocessed-dvf:
  type: partitions.PartitionedDataset
  path: data/02_intermediate/preprocessed/
  dataset:
    type: pandas.ParquetDataset
  filename_suffix: ".parquet"
  save_lazily: True
  metadata:
    kedro-viz:
      layer: intermediate