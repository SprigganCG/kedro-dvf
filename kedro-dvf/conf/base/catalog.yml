# Here you can define all your datasets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/data/data_catalog.html


_csv: &csv
  type: pandas.CSVDataset
  load_args:
    sep: "|"
    compression: 'zip'
    encoding: "utf-8"
    decimal: '.'
    date_format: "%d/%m/%Y"
    low_memory: False
    parse_dates: True
  metadata:
    kedro-viz:
      layer: raw

# dvf data for each year
raw-dvf-2025:
  <<: *csv
  filepath: data/01_raw/data.gouv.fr/valeursfoncieres-2025.txt.zip

raw-dvf-2024:
  <<: *csv
  filepath: data/01_raw/data.gouv.fr/valeursfoncieres-2024.txt.zip

raw-dvf-2023:
  <<: *csv
  filepath: data/01_raw/data.gouv.fr/valeursfoncieres-2023.txt.zip

raw-dvf-2022:
  <<: *csv
  filepath: data/01_raw/data.gouv.fr/valeursfoncieres-2022.txt.zip

raw-dvf-2021:
  <<: *csv
  filepath: data/01_raw/data.gouv.fr/valeursfoncieres-2021.txt.zip

raw-dvf-2020:
  <<: *csv
  filepath: data/01_raw/data.gouv.fr/valeursfoncieres-2020.txt.zip


# intermediate series of datasets
int-imported-dvf.{year}:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/01_imported/int-imported-dvf.{year}.parquet
  metadata:
    kedro-viz:
      layer: intermediate

